<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMind 화면</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page detail-page">
      <nav class="top-menu" aria-label="기능 메뉴">
        <button class="menu-item" data-screen="ai-note">AI 독서 노트</button>
        <button class="menu-item" data-screen="ai-quiz">AI 독서 퀴즈</button>
        <button class="menu-item" data-screen="memory-report">AI 기능 복습</button>
        <button class="menu-item" data-screen="essay-refine">AI 독후감 도우미</button>
        <button class="menu-item" data-screen="load-file">AI 필사 불러오기</button>
        <button class="menu-item" data-screen="save-copy">AI 필사 저장</button>
      </nav>

      <section class="screen detail-card">
        <h2 id="screen-title">화면</h2>
        <p id="screen-description">요청한 화면 설명이 여기에 표시됩니다.</p>
        <div id="screen-content"></div>
      </section>

      <footer class="bottom-return">
        <button class="btn" id="go-home">메인으로 돌아가기</button>
      </footer>
    </main>

    <script src="screen.js"></script>
  </body>
</html>
